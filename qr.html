<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QR Card</title>
  <script src="config.js?v=2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: #eef2f9; color: #111827;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* One tall card that fills the phone screen. Everything is sized from the
       card's own height/width (cqh/cqw), and the saved image uses the same numbers. */
    .card {
      position: relative; container-type: size; overflow: hidden; margin: 0 auto;
      width: min(100vw, 56.25dvh); height: 100vh; height: 100dvh;
    }
    /* Banner scaled to the card's height and shifted so the AIoD logo sits top-left
       and www.aiodp.ai bottom-left */
    .bg {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #bcd3f5, #5b8fe0);
      background-repeat: no-repeat; background-size: auto 100%; background-position: -9.6cqh 0;
    }
    .panel {
      --q: min(70cqw, 36cqh); /* QR size */
      position: absolute; left: 50%; top: 53.5cqh; transform: translate(-50%, -50%);
      padding: calc(var(--q) * .07); text-align: center;
      background: #fff; border-radius: calc(var(--q) * .08);
      box-shadow: 0 1.2cqh 3.5cqh rgba(15,40,100,.22);
    }
    .qr { width: var(--q); }
    .qr img, .qr canvas { display: block; width: 100%; height: auto; }
    .name {
      margin: calc(var(--q) * .06) 0 calc(var(--q) * .02);
      font-size: calc(var(--q) * .078); font-weight: 700; line-height: 1.2; white-space: nowrap;
    }
    .title, .org { margin: 0; font-size: calc(var(--q) * .057); line-height: 1.35; color: #4b5563; }
    .org { color: #990000; font-weight: 600; } /* DTU red */
    .eu { position: absolute; left: 6.35cqh; top: 90cqh; height: 5cqh; border-radius: .6cqh; }

    /* Below the card, so a screenshot of the screen is just the card */
    .below { padding: 24px 16px 40px; text-align: center; }
    button {
      min-height: 48px; padding: 10px 22px; font: inherit; font-weight: 600; color: #fff;
      background: #990000; border: 0; border-radius: 10px; cursor: pointer;
    }
    .hint { margin: 10px auto 0; max-width: 340px; font-size: .85rem; color: #6b7280; }
    .url { margin-top: 6px; font-size: .75rem; color: #9ca3af; word-break: break-all; }

    /* On a computer, show it as a phone-shaped preview */
    @media (min-width: 700px) and (min-height: 600px) {
      .card { width: 51.75dvh; height: 92dvh; margin-top: 4dvh; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bg" id="bg"></div>
    <div class="panel">
      <div class="qr" id="qr"></div>
      <p class="name" id="name"></p>
      <p class="title" id="title"></p>
      <p class="org" id="org"></p>
    </div>
    <img class="eu" src="assets/eu-funded.png" alt="Funded by the European Union">
  </div>

  <div class="below">
    <button id="save">Save to phone</button>
    <p class="hint">Saves the card as an image, so you can show it from your photos even without internet.</p>
    <p class="url" id="url"></p>
  </div>

  <script>
    const p = window.PROFILE;
    const target = p.profileUrl || new URL("./", location.href).href;

    document.getElementById("name").textContent = p.name;
    document.getElementById("title").textContent = p.title;
    document.getElementById("org").textContent = p.org;
    document.getElementById("url").textContent = target;

    // Render the QR large so it stays sharp on high-resolution screens
    new QRCode(document.getElementById("qr"), {
      text: target, width: 600, height: 600,
      colorDark: "#111827", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    const load = src => new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
    const bgReady = load(p.background).then(img => {
      if (img) document.getElementById("bg").style.backgroundImage = `url("${p.background}")`;
      return img;
    });
    const euReady = load("assets/eu-funded.png");

    // Draw the same layout as the on-screen card, at this phone's screen resolution
    async function drawCard() {
      const dpr = window.devicePixelRatio || 1;
      const portrait = screen.height > screen.width;
      let W = Math.round((portrait ? screen.width : screen.height) * dpr);
      let H = Math.round((portrait ? screen.height : screen.width) * dpr);
      if (W / H > .5625 || W < 900) { W = 1179; H = 2556; } // computers: a typical phone size

      const [bg, eu] = await Promise.all([bgReady, euReady]);
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const ctx = c.getContext("2d");

      if (bg) {
        ctx.drawImage(bg, -.096 * H, 0, H * bg.naturalWidth / bg.naturalHeight, H);
      } else {
        const g = ctx.createLinearGradient(0, 0, W, H);
        g.addColorStop(0, "#bcd3f5"); g.addColorStop(1, "#5b8fe0");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }

      const q = Math.min(.70 * W, .36 * H), pad = .07 * q;
      const font = getComputedStyle(document.body).fontFamily;
      const lines = [
        { text: p.name, size: .078 * q, lh: 1.2, weight: 700, color: "#111827", gap: .06 * q },
        { text: p.title, size: .057 * q, lh: 1.35, weight: 400, color: "#4b5563", gap: .02 * q },
        { text: p.org, size: .057 * q, lh: 1.35, weight: 600, color: "#990000", gap: 0 }
      ];
      const textH = lines.reduce((h, l) => h + l.gap + l.size * l.lh, 0);
      const pw = q + 2 * pad, ph = q + textH + 2 * pad;
      const px = (W - pw) / 2, py = .535 * H - ph / 2;

      ctx.save();
      ctx.shadowColor = "rgba(15,40,100,.22)"; ctx.shadowBlur = .035 * H; ctx.shadowOffsetY = .012 * H;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.roundRect(px, py, pw, ph, .08 * q); ctx.fill();
      ctx.restore();

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(document.querySelector("#qr canvas"), px + pad, py + pad, q, q);
      ctx.imageSmoothingEnabled = true;

      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      let y = py + pad + q;
      for (const l of lines) {
        y += l.gap;
        ctx.font = `${l.weight} ${l.size}px ${font}`;
        ctx.fillStyle = l.color;
        ctx.fillText(l.text, W / 2, y + l.size * l.lh / 2);
        y += l.size * l.lh;
      }

      if (eu) {
        const eh = .05 * H, ew = eh * eu.naturalWidth / eu.naturalHeight;
        ctx.save();
        ctx.beginPath(); ctx.roundRect(.0635 * H, .90 * H, ew, eh, .006 * H); ctx.clip();
        ctx.drawImage(eu, .0635 * H, .90 * H, ew, eh);
        ctx.restore();
      }
      return c;
    }

    // On phones, the share sheet offers "Save Image" to Photos; elsewhere it downloads
    document.getElementById("save").onclick = async () => {
      const canvas = await drawCard();
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      const file = new File([blob], "qr-card.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; }
        catch (e) { if (e.name === "AbortError") return; }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "qr-card.png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
  </script>
</body>
</html>
