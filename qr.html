<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Card</title>
  <script src="config.js?v=2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
      background: #eef2f9; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827;
    }
    .wrap { width: 100%; max-width: 900px; }

    /* The printable card keeps the banner's 1200x627 shape; everything inside
       is sized in cqw so it scales as one piece on any screen and on paper. */
    .card {
      container-type: inline-size; position: relative; width: 100%; aspect-ratio: 1200 / 627;
      border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.12);
      background: linear-gradient(135deg, #bcd3f5, #5b8fe0) center / cover no-repeat;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 31cqw; padding: 2.2cqw 2.4cqw 2cqw; text-align: center;
      background: #fff; border-radius: 2cqw; box-shadow: 0 1cqw 3cqw rgba(15,40,100,.18);
    }
    #qr img, #qr canvas { display: block; width: 100%; height: auto; }
    .name { margin: 1.4cqw 0 .3cqw; font-size: 2.4cqw; font-weight: 700; line-height: 1.2; }
    .title, .org { margin: 0; font-size: 1.7cqw; line-height: 1.3; color: #4b5563; }
    .org { color: #990000; font-weight: 600; } /* DTU red */

    .actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    button {
      flex: 1 1 140px; max-width: 220px; min-height: 44px; color: inherit;
      border: 1px solid #d1d5db; background: #fff; border-radius: 8px;
      padding: 8px 14px; font: inherit; cursor: pointer;
    }
    button:hover { background: #f9fafb; }
    .url { margin-top: 10px; text-align: center; font-size: .75rem; color: #6b7280; word-break: break-all; }

    @page { size: A4 landscape; margin: 12mm; }
    @media print {
      body { background: #fff; padding: 0; min-height: 0; }
      .wrap { max-width: none; }
      .card { box-shadow: none; border-radius: 0; }
      .actions, .url { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="panel">
        <div id="qr"></div>
        <p class="name" id="name"></p>
        <p class="title" id="title"></p>
        <p class="org" id="org"></p>
      </div>
    </div>
    <div class="actions">
      <button id="downloadCard">Download card</button>
      <button id="download">Download QR</button>
      <button onclick="window.print()">Print</button>
    </div>
    <p class="url" id="url"></p>
  </div>

  <script>
    const p = window.PROFILE;
    const target = p.profileUrl || new URL("./", location.href).href;

    document.getElementById("name").textContent = p.name;
    document.getElementById("title").textContent = p.title;
    document.getElementById("org").textContent = p.org;
    document.getElementById("url").textContent = target;

    // Render the QR large so it stays sharp when printed
    new QRCode(document.getElementById("qr"), {
      text: target, width: 600, height: 600,
      colorDark: "#111827", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    // Banner background, keeping the gradient if the file is missing
    const bg = new Image();
    bg.onload = () => {
      document.getElementById("card").style.backgroundImage = `url("${p.background}")`;
    };
    bg.src = p.background;

    const save = (canvas, filename) => {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = filename;
      a.click();
    };

    document.getElementById("download").onclick = () => {
      save(document.querySelector("#qr canvas"), "qr-code.png");
    };

    // Draw the same layout as the on-screen card at 2x banner resolution
    document.getElementById("downloadCard").onclick = () => {
      const W = 2400, H = 1254, u = W / 100; // u = 1cqw
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const ctx = c.getContext("2d");

      if (bg.complete && bg.naturalWidth) {
        ctx.drawImage(bg, 0, 0, W, H);
      } else {
        const g = ctx.createLinearGradient(0, 0, W, H);
        g.addColorStop(0, "#bcd3f5"); g.addColorStop(1, "#5b8fe0");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }

      const font = getComputedStyle(document.body).fontFamily;
      const pw = 31 * u, qr = pw - 4.8 * u;
      const lines = [
        { text: p.name, size: 2.4 * u, weight: 700, color: "#111827", gap: 1.4 * u },
        { text: p.title, size: 1.7 * u, weight: 400, color: "#4b5563", gap: .3 * u },
        { text: p.org, size: 1.7 * u, weight: 600, color: "#990000", gap: 0 }
      ];
      const textH = lines.reduce((h, l) => h + l.gap + l.size * 1.3, 0);
      const ph = 2.2 * u + qr + textH + 2 * u;
      const px = (W - pw) / 2, py = (H - ph) / 2;

      ctx.save();
      ctx.shadowColor = "rgba(15,40,100,.18)"; ctx.shadowBlur = 3 * u; ctx.shadowOffsetY = u;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 2 * u); ctx.fill();
      ctx.restore();

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(document.querySelector("#qr canvas"), px + 2.4 * u, py + 2.2 * u, qr, qr);

      ctx.textAlign = "center"; ctx.textBaseline = "top";
      let y = py + 2.2 * u + qr;
      for (const l of lines) {
        y += l.gap;
        ctx.font = `${l.weight} ${l.size}px ${font}`;
        ctx.fillStyle = l.color;
        ctx.fillText(l.text, W / 2, y + l.size * .15);
        y += l.size * 1.3;
      }
      save(c, "qr-card.png");
    };
  </script>
</body>
</html>
